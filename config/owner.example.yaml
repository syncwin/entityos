# Placeholder values only. In a private instance, copy to config/owner.yaml and fill in.
# Nothing outside config/owner.yaml may reference an owner's name or brand directly.
# Every claim and source points at one of these ids via entity_id. Ids are unique across the vault.
entities:
  - id: example-owner
    type: person
    name: Example Person
  - id: example-brand
    type: brand
    name: Example Brand
  - id: example-company
    type: organization
    name: Example Company
